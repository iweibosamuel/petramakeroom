[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Local testing with `npm run dev:netlify` (Netlify CLI). It runs Vite on
# 5173 behind http://localhost:8888, serves the functions at
# /.netlify/functions/*, and loads RESEND_API_KEY and the Supabase keys from
# .env (never committed — see .gitignore).
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Single-page app: send every route (e.g. /give/schedule/<id> from an email
# link) to index.html so React Router can handle it. Real files like images
# and fonts are still served as-is, and /.netlify/functions/* is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
